function pshow(i){const d=document.createElement('div');d.id='rc';d.style.alignItems='flex-start';d.innerHTML=`<div style="max-width:820px;padding:0;overflow:hidden">${pdoc(i,'A4',PH)}<div class="np" style="padding:12px 14px;display:flex;gap:6px;flex-wrap:wrap;align-items:center;background:#f4efe3"><label class="ck" style="color:#000!important"><input type="checkbox" ${PH?'checked':''} onchange="PH=this.checked;pshow(${i})">📷 Photos print mein</label>${Object.keys(PS).map(k=>`<button class="btn s" onclick="pgo(${i},'${k}')">🖨 ${k}</button>`).join('')}<button class="btn s g" style="color:#000" onclick="this.closest('#rc').remove()">Close</button></div></div>`;showOv(d)}
const pgo=(i,k)=>pr(pdoc(i,k,PH),PS[k]),showOv=x=>{document.querySelectorAll('#rc').forEach(e=>e.remove());document.body.appendChild(x)};
function pr(h,p){const o=$('pfr');if(o)o.remove();const fr=document.createElement('iframe');fr.id='pfr';fr.style.cssText='position:fixed;left:-9999px;top:0;width:800px;height:600px;border:0';document.body.appendChild(fr);const css=[...document.querySelectorAll('style')].map(s=>s.textContent).join('\n'),d=fr.contentWindow.document;d.open();
 d.write('<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet"><style>'+css+'</style><style>@page{size:'+p[0]+';margin:'+p[1]+'}html,body{background:#fff!important;color:#000!important;margin:0;height:auto!important;display:block}#rc{position:static!important;display:block!important;background:none!important;padding:0!important}#rc>div{max-width:'+p[2]+'!important;width:100%!important;margin:0 auto!important;font-size:'+p[3]+'!important;padding:'+p[4]+'!important}</style></head><body><div id="rc">'+h+'</div></body></html>');d.close();
 setTimeout(()=>{try{fr.contentWindow.focus();fr.contentWindow.print()}catch(e){alert('Print nahi ho saka: '+e.message)}},900)}
/* ====== tools ====== */
async function dl(name,data){if(/\.csv$/.test(name))data='\ufeff'+data;try{const b=new Blob([data],{type:'text/plain;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},800)}catch(e){alert('Download nahi ho saka')}}
function csv(k){const h=['no',...M[k].map(c=>c[0])];return[h.join(',')].concat(S[k].map(r=>h.map(c=>'"'+String(r[c]==null?'':r[c]).replace(/"/g,'""')+'"').join(','))).join('\n')}
function backup(){const o={};KEYS.forEach(k=>{if(k!=='photos')o[k]=S[k]});try{localStorage.setItem('sh_lastbk',Date.now())}catch(e){}dl('sajjad-backup-'+td()+'.json',JSON.stringify(o))}
function restore(el){const fr=new FileReader();fr.onload=()=>{try{const o=JSON.parse(fr.result);KEYS.forEach(k=>{if(Array.isArray(o[k])&&k!=='photos'){S[k]=o[k];save(k)}});render();alert('Restore ho gaya ✔')}catch(e){alert('File sahi nahi hai')}};fr.readAsText(el.files[0])}
function untrash(k,id){fs.collection(COL(k)).doc(id).update({_del:false}).then(()=>status('✔ Wapas aa gayi')).catch(e=>alert(e.code||e.message))}
function savecfg(fm){const d=new FormData(fm);S.cfg=[Object.assign(S.cfg[0]||{},{name:(d.get('name')||'').trim()||DEF_NAME,tag:d.get('tag'),phone:d.get('phone'),addr:d.get('addr')})];save('cfg');render();return false}
function chpw(){if(au&&au.currentUser&&confirm('Password reset email '+au.currentUser.email+' par bheji jaye?'))au.sendPasswordResetEmail(au.currentUser.email).then(()=>alert('Email bhej di gayi ✔')).catch(x=>alert(x.code))}
function notif(){try{Notification.requestPermission().then(p=>alert(p==='granted'?'Notifications ON ✔':'Allow nahi hua'))}catch(e){alert('Is browser mein support nahi')}}
function tools(){const c=cf(),L=[];KEYS.forEach(k=>(TR[k]||[]).forEach(r=>L.push([k,r])));L.sort((a,b)=>(b[1]._dt||0)-(a[1]._dt||0));
 return`<h2>Tools</h2><div class="box"><b>Clinic Profile (print aur dashboard par nazar aayega)</b><br><br><form onsubmit="return savecfg(this)"><div><label>Clinic Name</label><input name="name" value="${esc(sn())}"></div><div><label>Tagline</label><input name="tag" value="${esc(c.tag)}"></div><div><label>Phone</label><input name="phone" value="${esc(c.phone)}"></div><div><label>Address</label><input name="addr" value="${esc(c.addr)}"></div><button class="btn">Save</button></form></div>
 <div class="box"><b>Export / Backup</b><br><br>${['pts','appt','staff','spay','cash'].map(k=>`<button class="btn s" onclick="dl('sajjad-${k}.csv',csv('${k}'))">⬇ ${({pts:'Patients',appt:'Bookings',staff:'Workers',spay:'Worker Pay',cash:'Cash Book'})[k]}</button>`).join(' ')} <button class="btn s" onclick="backup()">⬇ Full Backup</button> <label class="btn s g" style="display:inline-block;cursor:pointer">⬆ Restore<input type="file" accept=".json" hidden onchange="restore(this)"></label><br><small style="color:var(--mut)">Photos cloud (Firebase) mein mehfooz rehti hain.</small></div>
 <div class="box"><b>🗑 Kachra (delete ki hui entries)</b><br><br>${tbl(['Kahan','Entry','Kab',''],L.filter(x=>x[0]!=='photos').slice(0,40).map(([k,r])=>`<tr><td>${k}</td><td>${esc(r.name||r.pname||r.worker||r.note||r.no||'')}</td><td>${new Date(r._dt||0).toLocaleString()}</td><td><button class="btn s" onclick="untrash('${k}','${r._id}')">↩ Wapas</button></td></tr>`))}</div>
 <div class="box"><b>Settings</b><br><br><button class="btn s" onclick="chpw()">🔑 Password Change</button> <button class="btn s g" onclick="toggleTheme()">🌓 Dark / Light</button> <button class="btn s g" onclick="notif()">🔔 Browser Notifications</button></div>`}
function setTheme(m){document.documentElement.dataset.theme=m;try{localStorage.setItem('sh_theme',m)}catch(e){}const b=$('thm');if(b)b.textContent=m==='dark'?'☀ Light':'🌙 Dark'}
function toggleTheme(){setTheme(document.documentElement.dataset.theme==='light'?'dark':'light')}
loadLocal();setBrand();setTheme(document.documentElement.dataset.theme||'dark');boot();
setInterval(()=>{if(!$('app').hidden&&tab==='dash'&&!busy()&&!$('rc')&&!$('al'))render()},300000);
</script></body></html>
